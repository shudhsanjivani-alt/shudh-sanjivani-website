name: Deploy Festival Pack Page Preview

on:
  push:
    branches:
      - stage-festival-pack-page-v1

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy isolated Festival Pack Page Preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Deploy isolated staging Worker
        run: npx wrangler deploy --name stage197-festival-pack-page-preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
