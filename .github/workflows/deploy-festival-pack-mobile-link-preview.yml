name: Deploy Festival Pack Mobile Link Preview
on:
  push:
    branches:
      - stage-festival-pack-mobile-link-fix

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy isolated mobile-link preview
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --no-save wrangler@latest
      - name: Create isolated preview configuration
        shell: bash
        run: |
          cat > wrangler.mobile-preview.jsonc <<'CONFIG'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "stage198-festival-pack-mobile-link-preview",
            "main": "./worker.js",
            "compatibility_date": "2026-09-11",
            "assets": {
              "directory": "./public",
              "binding": "ASSETS",
              "run_worker_first": ["/api/*", "/", "/index.html", "/assets/festival-15-spice-pack.webp", "/assets/02-whole-black-pepper.jpg"]
            }
          }
          CONFIG
      - name: Deploy isolated staging Worker only
        run: npx wrangler deploy --config wrangler.mobile-preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
