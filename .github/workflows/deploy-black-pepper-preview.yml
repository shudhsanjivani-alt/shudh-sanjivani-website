name: Deploy Black Pepper Blog Preview
on:
  push:
    branches:
      - stage-black-pepper-blog
permissions:
  contents: read
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    name: Deploy Black Pepper Blog Preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler and browser diagnostics
        run: |
          npm install --no-save wrangler@latest playwright
          npx playwright install --with-deps chromium
      - name: Deploy Worker Preview
        run: npx wrangler preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Diagnose image headers and actual browser rendering
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URL="https://raw.githubusercontent.com/shudhsanjivani-alt/shudh-sanjivani-website/stage-black-pepper-blog/public/assets/02-whole-black-pepper.jpg"
          PAGE_URL="https://stage-black-pepper-blog-sandeep.shudhsanjivani.workers.dev/"
          echo "=== IMAGE HEADERS ==="
          curl -sSIL "$IMAGE_URL" | grep -iE '^(HTTP/|content-type:|content-length:|content-security-policy:|cross-origin-resource-policy:|x-content-type-options:|location:)' || true
          echo "=== PREVIEW PAGE HEADERS ==="
          curl -sSIL "$PAGE_URL" | grep -iE '^(HTTP/|content-type:|content-security-policy:|cross-origin-resource-policy:|x-content-type-options:|location:)' || true
          echo "=== BROWSER RENDER TEST ==="
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          page.on('console', msg => { if (msg.type() === 'error') console.log('CONSOLE_ERROR:', msg.text()); });
          page.on('requestfailed', req => console.log('REQUEST_FAILED:', req.url(), req.failure()?.errorText));
          page.on('response', res => {
            if (res.url().includes('02-whole-black-pepper.jpg')) console.log('IMAGE_HTTP:', res.status(), res.headers()['content-type'], res.url());
          });
          try {
            const response = await page.goto('https://stage-black-pepper-blog-sandeep.shudhsanjivani.workers.dev/', { waitUntil: 'networkidle', timeout: 60000 });
            console.log('PAGE_HTTP:', response?.status());
            const matches = page.locator('img[src*="02-whole-black-pepper.jpg"]');
            console.log('PEPPER_IMAGE_COUNT:', await matches.count());
            if (await matches.count() === 0) {
              console.log('CARD_COUNT:', await page.locator('#black-pepper-blog-card').count());
              console.log('PEPPER_IMAGES_IN_DOM:', JSON.stringify(await page.locator('img').evaluateAll(imgs => imgs.map(img => img.currentSrc || img.src).filter(src => src.includes('pepper')))));
            } else {
            const result = await matches.first().evaluate(img => ({
              src: img.currentSrc || img.src,
              complete: img.complete,
              naturalWidth: img.naturalWidth,
              naturalHeight: img.naturalHeight,
              display: getComputedStyle(img).display,
              visibility: getComputedStyle(img).visibility,
              opacity: getComputedStyle(img).opacity,
              rect: (() => { const r = img.getBoundingClientRect(); return {width:r.width,height:r.height,top:r.top,left:r.left}; })()
            }));
            console.log('IMAGE_RENDER_RESULT:', JSON.stringify(result));
            console.log('CARD_VISIBLE:', await page.locator('#black-pepper-blog-card').count() ? await page.locator('#black-pepper-blog-card').isVisible() : false);
            }
          } finally {
            await browser.close();
          }
          NODE
