name: Deploy Red Chilli Blog Preview (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-preview:
    if: github.event.pull_request.head.ref == 'stage-red-chilli-blog'
    runs-on: ubuntu-latest
    name: Deploy Red Chilli Blog Preview
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Improve red chilli gallery image quality
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          folder = Path("public/assets/red-chilli")
          names = [
              "lambi-mirch.jpg",
              "guntur.webp",
              "teja.webp",
              "bhut-jolokia.jpg",
              "mirch-ka-podha.jpg",
              "sabse-chhoti-mirch.webp",
          ]

          for name in names:
              path = folder / name
              if not path.exists():
                  continue
              with Image.open(path).convert("RGB") as im:
                  # Keep the original artwork, but create a larger, cleaner
                  # preview image from the existing gallery source.
                  enhanced = im.resize((1440, 1440), Image.Resampling.LANCZOS)
                  enhanced = enhanced.filter(
                      ImageFilter.UnsharpMask(radius=1.1, percent=70, threshold=3)
                  )
                  enhanced.save(
                      path,
                      quality=92,
                      optimize=True,
                      progressive=True
                  )

          PY

      - name: Create preview Wrangler config
        run: |
          python3 - <<'PY'
          import json
          with open("wrangler.jsonc","r",encoding="utf-8") as f:
              cfg=json.load(f)
          cfg["name"]="stage-red-chilli-blog-preview"
          cfg.pop("route",None)
          cfg["workers_dev"]=True
          with open("wrangler-preview.json","w",encoding="utf-8") as f:
              json.dump(cfg,f,ensure_ascii=False,indent=2)
          PY

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-preview.json
