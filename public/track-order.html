<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>पार्सल ट्रैक करें | Shudh Sanjivani</title>
<meta name="description" content="Shudh Sanjivani पर अपने पार्सल का shipment tracking status देखें।">
<style>
:root{--cream:#f7f1e4;--sage:#65735a;--sage2:#43513d;--copper:#a9653f;--ink:#293027;--line:#ddd2bf;--white:#fffdf8}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:28px 16px 50px}.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 28px rgba(54,45,30,.08)}
.brand{text-align:center;color:var(--sage2);font-weight:800;letter-spacing:.4px;font-size:14px}.brand small{display:block;color:var(--copper);font:800 11px Arial,sans-serif;letter-spacing:1.5px;margin-top:4px}
h1{font-size:28px;text-align:center;margin:8px 0 6px;color:var(--sage2)}.sub{text-align:center;color:#66705f;font-size:14px;margin:0 0 20px}
label{display:block;font:800 12px Arial,sans-serif;color:#596055;margin-bottom:7px}input{width:100%;padding:13px 14px;border:1px solid #cfc6b7;border-radius:10px;background:#fff;font:600 15px Arial,sans-serif}button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;background:var(--copper);color:#fff;font:800 14px Arial,sans-serif;cursor:pointer}
.result{margin-top:20px}.status{background:#f3eee4;border-radius:12px;padding:14px}.status b{color:var(--sage2)}.activity{border-left:2px solid #d8c8b4;margin:15px 0 0 8px;padding-left:16px}.item{margin:0 0 15px}.date{font:800 11px Arial,sans-serif;color:#8a6a3b}.desc{font-weight:700}.loc{font-size:12px;color:#697168;margin-top:2px}.muted{color:#737970;font-size:12px}.back{display:block;text-align:center;margin-top:18px;color:var(--sage2);text-decoration:none;font:800 13px Arial,sans-serif}
.error{background:#fff1eb;color:#8a4934;border:1px solid #edcabb;padding:12px;border-radius:10px;font-size:13px}
</style>
</head>
<body>
<main class="wrap"><section class="card">
<div class="brand">SHUDH SANJIVANI<small>PURE • SIMPLE • EVERYDAY</small></div>
<h1>📦 पार्सल ट्रैक करें</h1>
<p class="sub">अपना Delhivery / Shiprocket Tracking ID डालकर shipment की स्थिति देखें।</p>
<label for="awb">Tracking ID / AWB</label>
<input id="awb" inputmode="text" autocomplete="off" placeholder="उदाहरण: 1904080215563">
<button id="btn">ट्रैक करें</button>
<div id="result" class="result"></div>
<a class="back" href="/">← मुख पेज पर वापस जाएँ</a>
</section></main>
<script>
const q=new URLSearchParams(location.search), input=document.getElementById('awb'), btn=document.getElementById('btn'), result=document.getElementById('result');
if(q.get('awb')) input.value=q.get('awb');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(d){
 const acts=(d.activities||[]).map(a=>'<div class="item"><div class="date">'+esc(a.date||'')+'</div><div class="desc">'+esc(a.status||'Update')+'</div><div class="loc">'+esc(a.location||'')+'</div></div>').join('');
 result.innerHTML='<div class="status"><div><b>Courier:</b> '+esc(d.courier)+'</div><div><b>Status:</b> '+esc(d.status)+'</div>'+(d.etd?'<div><b>Expected delivery:</b> '+esc(d.etd)+'</div>':'')+'</div>'+(acts?'<div class="activity">'+acts+'</div>':'<p class="muted">अभी detailed activity उपलब्ध नहीं है। कुछ समय बाद फिर जाँचें।</p>');
}
async function track(){
 const awb=input.value.trim(); if(!awb){result.innerHTML='<div class="error">कृपया Tracking ID डालें।</div>';return}
 btn.disabled=true;btn.textContent='Tracking लोड हो रही है…';result.innerHTML='';
 try{
  const r=await fetch('/api/shipping/track?awb='+encodeURIComponent(awb),{cache:'no-store'});
  const d=await r.json();
  if(!r.ok||!d.ok) throw new Error(d.error||'Tracking उपलब्ध नहीं है।');
  render(d); history.replaceState(null,'','/track-order?awb='+encodeURIComponent(awb));
 }catch(e){result.innerHTML='<div class="error">'+esc(e.message)+'</div>'}
 finally{btn.disabled=false;btn.textContent='ट्रैक करें'}
}
btn.addEventListener('click',track);input.addEventListener('keydown',e=>{if(e.key==='Enter')track()});
if(input.value) track();
</script>
</body>
</html>
